// ============ STATE ============
let cart = {};
let favorites = new Set();
let activeCategory = 'hero';
let searchMode = false;

// ============ HELPERS ============
const arabicNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function toArabic(n) {
  return String(n).split('').map(d => /\d/.test(d) ? arabicNums[parseInt(d)] : d).join('');
}

function formatPrice(n) {
  return toArabic(n.toLocaleString('en-US'));
}

function getAllItems() {
  const all = [];
  Object.entries(menu).forEach(([catId, cat]) => {
    cat.items.forEach(item => all.push({ ...item, categoryId: catId, categoryName: cat.name }));
  });
  return all;
}

function getItem(id) {
  return getAllItems().find(i => i.id === id);
}

// ============ RENDER CATEGORIES ============
function renderCategories() {
  const wrapper = document.getElementById('categoriesWrapper');
  wrapper.innerHTML = '';

  Object.entries(menu).forEach(([id, cat]) => {
    const pill = document.createElement('button');
    pill.className = 'category-pill' + (id === activeCategory ? ' active' : '');
    pill.dataset.cat = id;
    pill.innerHTML = `<span class="emoji">${cat.emoji}</span><span>${cat.name}</span>`;
    pill.onclick = () => scrollToCategory(id);
    wrapper.appendChild(pill);
  });
}

function updateActiveCategory(id) {
  activeCategory = id;
  document.querySelectorAll('.category-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.cat === id);
    if (p.dataset.cat === id) {
      p.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });
}

function scrollToCategory(id) {
  const el = document.getElementById(`cat-${id}`);
  if (el) {
    const y = el.getBoundingClientRect().top + window.scrollY - 130;
    window.scrollTo({ top: y, behavior: 'smooth' });
  }
  updateActiveCategory(id);
}

// ============ RENDER MENU ============
function renderMenu() {
  const content = document.getElementById('menuContent');
  content.innerHTML = '';

  Object.entries(menu).forEach(([catId, cat]) => {
    const section = document.createElement('section');
    section.className = 'section';
    section.id = `cat-${catId}`;

    if (catId === 'hero') {
      section.innerHTML = renderHeroSection(cat);
    } else {
      section.innerHTML = `
        <h2 class="section-title">
          <span>${cat.emoji}</span>
          <span>${cat.name}</span>
          <span class="en">${cat.nameEn}</span>
        </h2>
        <div class="items-list">
          ${cat.items.map(it => renderItem(it)).join('')}
        </div>
      `;
    }
    content.appendChild(section);
  });

  attachItemHandlers();
}

function renderHeroSection(cat) {
  return `
    <div class="hero-dish-section">
      <div class="hero-dish-eyebrow">الطبق البطل · HOUSE SPECIAL</div>
      <div class="hero-dish-title">القابلي بلو</div>
      <div class="hero-dish-sub">QABILI PLOU</div>
      <p class="hero-dish-desc">أرز بسمتي طويل الحبة، متبّل بالتوابل الشرقية، مزيّن بالجزر والزبيب الذهبي، مع قطعة فاخرة من لحم الخروف المطبوخ ببطء.</p>
      <div class="sizes-grid">
        ${cat.items.map((it, i) => `
          <div class="size-card${i === 0 ? ' featured' : ''}${cart[it.id] ? ' in-cart' : ''}" data-id="${it.id}">
            <h4>${it.name.split('—')[1] || it.name}</h4>
            <div class="size-desc">${it.desc.split('.')[1] || ''}</div>
            <div class="size-price">${formatPrice(it.price)}<small>دينار عراقي</small></div>
            <button class="add-size-btn" data-add="${it.id}">
              ${cart[it.id] ? `✓ في طلبي (${toArabic(cart[it.id])})` : '+ أضف للطلب'}
            </button>
          </div>
        `).join('')}
      </div>
      <div class="served-with">
        <strong>يُقدَّم مع:</strong> زبادي بالزعتر · صلصة طماطم حارة · مكبوس الفستق · خبز طازج
      </div>
    </div>
  `;
}

function renderItem(it) {
  const inCart = cart[it.id] || 0;
  const fav = favorites.has(it.id);
  const tags = (it.tags || []).map(t => {
    const labels = { signature: '⭐ مميز', popular: '🔥 شائع', spicy: '🌶 حار', veg: '🌿 نباتي', new: 'جديد' };
    return `<span class="tag ${t}">${labels[t] || t}</span>`;
  }).join('');

  return `
    <div class="menu-item${inCart ? ' in-cart' : ''}${it.tags?.includes('popular') || it.tags?.includes('signature') ? ' popular' : ''}" data-id="${it.id}">
      <div class="item-top">
        <div class="item-info">
          ${tags ? `<div class="item-tags">${tags}</div>` : ''}
          <div class="item-name">${it.name}</div>
          <div class="item-name-en">${it.nameEn}</div>
          <div class="item-description">${it.desc}</div>
        </div>
        <div class="item-right">
          <div class="item-price">${formatPrice(it.price)}<small>د.ع</small></div>
          <div class="item-actions">
            <button class="fav-btn${fav ? ' active' : ''}" data-fav="${it.id}">${fav ? '❤️' : '🤍'}</button>
            ${inCart > 0
              ? `<div class="quantity-control">
                   <button class="qty-btn" data-minus="${it.id}">−</button>
                   <span class="qty-value">${toArabic(inCart)}</span>
                   <button class="qty-btn" data-plus="${it.id}">+</button>
                 </div>`
              : `<button class="add-btn" data-add="${it.id}">+</button>`
            }
          </div>
        </div>
      </div>
    </div>
  `;
}

function attachItemHandlers() {
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); addToCart(b.dataset.add); });
  document.querySelectorAll('[data-plus]').forEach(b => b.onclick = e => { e.stopPropagation(); addToCart(b.dataset.plus, true); });
  document.querySelectorAll('[data-minus]').forEach(b => b.onclick = e => { e.stopPropagation(); removeFromCart(b.dataset.minus); });
  document.querySelectorAll('[data-fav]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); });
}

// ============ CART ============
function addToCart(id, silent = false) {
  cart[id] = (cart[id] || 0) + 1;
  updateUI();
  if (!silent) showToast('✓ تمّت الإضافة');
  animateBadge('cartBadge');
}

function removeFromCart(id) {
  if (!cart[id]) return;
  cart[id]--;
  if (cart[id] <= 0) delete cart[id];
  updateUI();
}

function clearCart() {
  cart = {};
  updateUI();
  showToast('✓ تم مسح الطلب');
}

function getCartTotal() {
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const it = getItem(id);
    return sum + (it ? it.price * qty : 0);
  }, 0);
}

function getCartCount() {
  return Object.values(cart).reduce((a, b) => a + b, 0);
}

// ============ FAVORITES ============
function toggleFav(id) {
  if (favorites.has(id)) favorites.delete(id);
  else { favorites.add(id); animateBadge('favBadge'); }
  updateUI();
}

// ============ UI UPDATES ============
function updateUI() {
  const count = getCartCount();
  const total = getCartTotal();
  const favCount = favorites.size;

  // Cart badges
  const cartBadge = document.getElementById('cartBadge');
  if (count > 0) {
    cartBadge.textContent = toArabic(count);
    cartBadge.style.display = 'flex';
  } else {
    cartBadge.style.display = 'none';
  }

  // Fav badge
  const favBadge = document.getElementById('favBadge');
  if (favCount > 0) {
    favBadge.textContent = toArabic(favCount);
    favBadge.style.display = 'flex';
  } else {
    favBadge.style.display = 'none';
  }

  // Cart bar
  const cartBar = document.getElementById('cartBar');
  if (count > 0) {
    cartBar.classList.add('visible');
    document.getElementById('cartBarCount').textContent = `${toArabic(count)} ${count === 1 ? 'طبق' : count === 2 ? 'طبقان' : 'أطباق'}`;
    document.getElementById('cartBarTotal').textContent = `${formatPrice(total)} د.ع`;
  } else {
    cartBar.classList.remove('visible');
  }

  // Re-render menu to update in-cart status
  renderMenu();
}

function animateBadge(id) {
  const b = document.getElementById(id);
  b.classList.remove('animate');
  void b.offsetWidth;
  b.classList.add('animate');
}

// ============ TOAST ============
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('visible'), 1800);
}

// ============ MODAL ============
function openModal(title, content) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = content;
  document.getElementById('modal').classList.add('visible');
  document.getElementById('modalBackdrop').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('visible');
  document.getElementById('modalBackdrop').classList.remove('visible');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalBackdrop').onclick = closeModal;

// ============ CART MODAL ============
document.getElementById('cartBtn').onclick = showCartModal;
document.getElementById('cartBar').onclick = showCartModal;

function showCartModal() {
  if (getCartCount() === 0) {
    openModal('طلبي', `
      <div class="modal-body">
        <div class="empty-cart">
          <div class="big-icon">🛒</div>
          <h4>لم تختر شيئاً بعد</h4>
          <p>اضغط على + بجانب أي طبق لإضافته إلى طلبك</p>
        </div>
      </div>
    `);
    return;
  }

  let html = '<div class="modal-body">';
  Object.entries(cart).forEach(([id, qty]) => {
    const it = getItem(id);
    if (!it) return;
    html += `
      <div class="cart-item">
        <div class="cart-item-info">
          <div class="cart-item-name">${it.name}</div>
          <div class="cart-item-price">${formatPrice(it.price)} × ${toArabic(qty)}</div>
        </div>
        <div class="quantity-control">
          <button class="qty-btn" data-minus="${id}">−</button>
          <span class="qty-value">${toArabic(qty)}</span>
          <button class="qty-btn" data-plus="${id}">+</button>
        </div>
        <div class="cart-item-subtotal">${formatPrice(it.price * qty)}</div>
      </div>
    `;
  });

  html += `
    <div class="cart-total-row">
      <div class="label">المجموع</div>
      <div class="amount">${formatPrice(getCartTotal())} د.ع</div>
    </div>
    <div class="cart-actions">
      <button class="cart-action-btn btn-share" id="shareBtn">📋 نسخ الطلب</button>
      <button class="cart-action-btn btn-clear" id="clearBtn">✕ مسح الكل</button>
    </div>
    </div>
  `;

  openModal(`طلبي (${toArabic(getCartCount())})`, html);

  // Re-attach handlers in modal
  document.querySelectorAll('#modalContent [data-plus]').forEach(b => b.onclick = e => { e.stopPropagation(); addToCart(b.dataset.plus, true); showCartModal(); });
  document.querySelectorAll('#modalContent [data-minus]').forEach(b => b.onclick = e => { e.stopPropagation(); removeFromCart(b.dataset.minus); showCartModal(); });

  document.getElementById('shareBtn').onclick = shareOrder;
  document.getElementById('clearBtn').onclick = () => { clearCart(); closeModal(); };
}

function shareOrder() {
  let text = '🍽 طلبي من مطعم زلال\n';
  text += '━━━━━━━━━━━━━\n';
  Object.entries(cart).forEach(([id, qty]) => {
    const it = getItem(id);
    if (it) text += `• ${it.name} × ${qty} = ${(it.price * qty).toLocaleString()} د.ع\n`;
  });
  text += '━━━━━━━━━━━━━\n';
  text += `💰 المجموع: ${getCartTotal().toLocaleString()} د.ع\n`;
  text += '━━━━━━━━━━━━━\n';
  text += '📍 زلال · طعم الأصل';

  // Try Web Share API first, fallback to clipboard
  if (navigator.share) {
    navigator.share({ title: 'طلبي من زلال', text }).catch(() => copyToClipboard(text));
  } else {
    copyToClipboard(text);
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('✓ نُسخ الطلب')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('✓ نُسخ الطلب'); } catch { showToast('⚠ فشل النسخ'); }
  document.body.removeChild(ta);
}

// ============ FAVORITES MODAL ============
document.getElementById('favBtn').onclick = showFavoritesModal;

function showFavoritesModal() {
  if (favorites.size === 0) {
    openModal('المفضلة', `
      <div class="modal-body">
        <div class="empty-cart">
          <div class="big-icon">❤️</div>
          <h4>لا توجد أطباق مفضلة بعد</h4>
          <p>اضغط على 🤍 بجانب أي طبق لإضافته للمفضلة</p>
        </div>
      </div>
    `);
    return;
  }

  let html = '<div class="modal-body"><div class="items-list">';
  favorites.forEach(id => {
    const it = getItem(id);
    if (it) html += renderItem(it);
  });
  html += '</div></div>';

  openModal(`المفضلة (${toArabic(favorites.size)})`, html);
  document.querySelectorAll('#modalContent [data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); addToCart(b.dataset.add); });
  document.querySelectorAll('#modalContent [data-plus]').forEach(b => b.onclick = e => { e.stopPropagation(); addToCart(b.dataset.plus); showFavoritesModal(); });
  document.querySelectorAll('#modalContent [data-minus]').forEach(b => b.onclick = e => { e.stopPropagation(); removeFromCart(b.dataset.minus); showFavoritesModal(); });
  document.querySelectorAll('#modalContent [data-fav]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); showFavoritesModal(); });
}

// ============ SEARCH ============
document.getElementById('searchBtn').onclick = showSearchModal;

function showSearchModal() {
  openModal('بحث', `
    <div class="search-input-wrapper">
      <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن طبق..." autocomplete="off" />
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-empty">
        <div style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;">🔍</div>
        <p>اكتب اسم الطبق بالعربية أو الإنجليزية</p>
      </div>
    </div>
  `);

  const input = document.getElementById('searchInput');
  setTimeout(() => input.focus(), 300);
  input.oninput = () => performSearch(input.value);
}

function performSearch(q) {
  const results = document.getElementById('searchResults');
  if (!q.trim()) {
    results.innerHTML = `<div class="search-empty"><div style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;">🔍</div><p>اكتب اسم الطبق بالعربية أو الإنجليزية</p></div>`;
    return;
  }

  const query = q.toLowerCase().trim();
  const matches = getAllItems().filter(it =>
    it.name.toLowerCase().includes(query) ||
    it.nameEn.toLowerCase().includes(query) ||
    it.desc.toLowerCase().includes(query)
  );

  if (matches.length === 0) {
    results.innerHTML = `<div class="search-empty"><div style="font-size: 3rem; opacity: 0.3; margin-bottom: 15px;">😔</div><p>لا توجد نتائج لـ "${q}"</p></div>`;
    return;
  }

  results.innerHTML = `<div class="items-list">${matches.map(renderItem).join('')}</div>`;

  // Reattach handlers
  results.querySelectorAll('[data-add]').forEach(b => b.onclick = e => { e.stopPropagation(); addToCart(b.dataset.add); performSearch(q); });
  results.querySelectorAll('[data-plus]').forEach(b => b.onclick = e => { e.stopPropagation(); addToCart(b.dataset.plus, true); performSearch(q); });
  results.querySelectorAll('[data-minus]').forEach(b => b.onclick = e => { e.stopPropagation(); removeFromCart(b.dataset.minus); performSearch(q); });
  results.querySelectorAll('[data-fav]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); performSearch(q); });
}

// ============ SCROLL SPY ============
let scrollTimeout;
window.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const cats = Object.keys(menu);
    for (let i = cats.length - 1; i >= 0; i--) {
      const el = document.getElementById(`cat-${cats[i]}`);
      if (el && el.getBoundingClientRect().top < 200) {
        if (activeCategory !== cats[i]) updateActiveCategory(cats[i]);
        break;
      }
    }
  }, 50);
}, { passive: true });
